<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMO CHARITY RUN | Моно-Батарейка</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Roboto:wght@700;900&display=swap" rel="stylesheet">
  
  <style>
    @import url('https://fonts.cdnfonts.com/css/road-rage');

    :root {
      --bg-color: #0b0216; /* Темно-фіолетовий фон банера */
      --accent-purple: #8100ff; /* Світло-фіолетовий/неоновий (блискавки) */
      --neon-glow: #bf00ff;
      --card-bg: rgba(18, 4, 38, 0.85);
      --card-bg-solid: #120426; /* Солідний колір для проміжків батареї */
      --border-glow: rgba(180, 0, 255, 0.4);
      --energy-blue: #00e5ff; /* Колір для енергії */
      --neon-magenta: #f500ff; /* Яскравий неоново-фіолетовий */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      /* Імітація фіолетового неонового сяйва та блискавок з фону */
      background-image: 
        radial-gradient(circle at 10% 80%, rgba(129, 0, 255, 0.4) 0%, transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(191, 0, 255, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(70, 0, 140, 0.2) 0%, transparent 60%);
      background-attachment: fixed;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* HEADER BANNER */
    .hero-container {
      text-align: center;
      max-width: 900px;
      width: 100%;
      margin-bottom: 30px;
      position: relative;
    }

    /* Текст "COSMO" - Roboto */
    .brand-title {
      font-family: 'Roboto', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 0.6em;
      color: #ffffff;
      text-transform: uppercase;
      text-indent: 0.6em;
      opacity: 0.95;
      margin-bottom: 25px;
    }

    /* ШРИФТ ROAD RAGE */
    .main-title {
      font-family: 'Road Rage', cursive;
      font-size: clamp(5rem, 12vw, 8.5rem);
      line-height: 0.85;
      color: #ffffff;
      text-transform: uppercase;
      margin: 20px 0 40px 0;
      letter-spacing: 3px;
      transform: rotate(-3deg);
      text-shadow: 
        0 0 10px rgba(255, 255, 255, 0.7),
        0 0 30px var(--accent-purple),
        0 0 60px var(--neon-glow);
      position: relative;
      z-index: 2;
    }

    /* СЛОГАН З БАТАРЕЄЮ */
    .slogan-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-top: 25px;
      padding: 10px 0;
    }

    /* Іконка батареї (зарядки) */
    .slogan-icon {
      width: 38px;
      height: 20px;
      border: 2px solid #fff;
      border-radius: 4px;
      padding: 2px;
      position: relative;
      display: flex;
      gap: 3px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }

    .slogan-icon::after {
      content: '';
      position: absolute;
      right: -6px;
      top: 4px;
      width: 3px;
      height: 8px;
      background: #fff;
      border-radius: 0 2px 2px 0;
    }

    .battery-bar {
      height: 100%;
      width: 25%; /* Під 4 поділки */
      background: #fff;
      box-shadow: 0 0 8px #fff;
      border-radius: 1px;
    }

    /* Текст слогану */
    .slogan-text {
      font-weight: 900;
      font-size: clamp(0.9rem, 2vw, 1.3rem);
      letter-spacing: 0.02em;
      text-transform: uppercase;
      text-align: left;
      line-height: 1.2;
    }

    /* MAIN CONTAINER (BATTERY + STATS) */
    .dashboard-card {
      width: 100%;
      max-width: 850px;
      background: var(--card-bg);
      border: 2px solid var(--border-glow);
      border-radius: 28px;
      padding: 35px 25px;
      backdrop-filter: blur(15px);
      box-shadow: 0 0 50px rgba(129, 0, 255, 0.3);
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 35px;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    @media (max-width: 700px) {
      .dashboard-card {
        grid-template-columns: 1fr;
      }
    }

    /* НЕОНОВА БАТАРЕЙКА */
    .battery-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Контакт на верхній частині батарейки (плюс) */
    .battery-nub {
      width: 50px;
      height: 18px;
      background: linear-gradient(90deg, #2a0845, #490e7a, #2a0845);
      border: 3px solid var(--neon-glow);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      box-shadow: 0 -5px 15px rgba(180, 0, 255, 0.5);
      z-index: 2;
    }

    /* Основний корпус батарейки */
    .battery-body {
      position: relative;
      width: 140px;
      height: 280px;
      background: rgba(10, 2, 20, 0.7);
      border: 3px solid var(--neon-glow);
      border-radius: 12px;
      box-shadow: 
        0 0 30px rgba(191, 0, 255, 0.4),
        inset 0 0 20px rgba(191, 0, 255, 0.2);
      padding: 6px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end; /* Заряд росте знизу вверх */
      z-index: 3;
    }

    /* ==========================================
       НЕОНОВО-ФІОЛЕТОВИЙ ПРОГРЕС БАТАРЕЙКИ
       ========================================== */
    .battery-level {
      width: 100%;
      height: 0%; /* Оновлюється через JS */
      background: linear-gradient(180deg, var(--neon-magenta) 0%, var(--accent-purple) 50%, #300066 100%);
      transition: height 1.5s cubic-bezier(0.25, 1, 0.5, 1);
      box-shadow: 
        0 0 20px var(--neon-magenta),
        0 0 40px var(--accent-purple),
        inset 0 0 15px rgba(255, 255, 255, 0.4);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      /* Мерехтливий неоновий пил */
      background-image: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
      background-size: 16px 16px;
      animation: static-noise 2s infinite linear;
    }

    /* Верхня неонова крайка рівня заряду */
    .battery-level::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: #ffffff;
      box-shadow: 0 0 10px #ffffff, 0 0 20px var(--neon-magenta);
      z-index: 2;
    }

    /* Сітка поділок (10 сегментів) */
    .battery-overlay {
      position: absolute;
      top: 6px; 
      left: 6px; 
      right: 6px; 
      bottom: 6px;
      z-index: 4;
      pointer-events: none;
      background: repeating-linear-gradient(
        to top,
        transparent,
        transparent calc(10% - 4px),
        var(--card-bg-solid) calc(10% - 4px),
        var(--card-bg-solid) 10%
      );
    }

    /* Відблиск на склі батарейки */
    .battery-body::after {
      content: '';
      position: absolute;
      top: 10px;
      left: 10px;
      width: 12px;
      height: 90%;
      background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.02) 100%);
      border-radius: 8px;
      pointer-events: none;
      z-index: 5;
    }

    .battery-percent {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.2rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 10px #000, 0 0 25px var(--neon-magenta);
      z-index: 6;
    }

    /* Ефекти енергії (блискавки та іскри) */
    .energy-surge {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .lightning-streak {
      position: absolute;
      background: var(--energy-blue);
      border-radius: 1px;
      box-shadow: 
        0 0 5px rgba(255, 255, 255, 0.8), 
        0 0 10px var(--energy-blue), 
        0 0 20px var(--neon-glow);
      opacity: 0.7;
      animation: lightning-flash 0.5s ease-in-out infinite alternate;
    }

    .energy-spark {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      box-shadow: 0 0 5px rgba(255, 255, 255, 1), 0 0 10px var(--energy-blue);
      animation: spark-drift 3s infinite linear;
    }

    @keyframes static-noise {
      0% { background-position: 0 0; }
      100% { background-position: -16px -16px; }
    }

    @keyframes lightning-flash {
      0% { opacity: 0.1; transform: scaleY(0.8) skewX(-5deg); }
      50% { opacity: 0.9; transform: scaleY(1.1) skewX(5deg); }
      100% { opacity: 0.1; transform: scaleY(0.8) skewX(-5deg); }
    }

    @keyframes spark-drift {
      0% { transform: translateY(100px) translateX(0); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateY(-100px) translateX(-10px); opacity: 0; }
    }

    /* RIGHT CONTENT SECTION */
    .stats-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .goal-badge {
      align-self: flex-start;
      background: rgba(129, 0, 255, 0.2);
      border: 1px solid var(--accent-purple);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 800;
      color: #e599ff;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-card {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(180, 0, 255, 0.3);
      border-radius: 18px;
      padding: 20px;
      transition: border-color 0.3s;
    }
    
    .stat-card:hover {
      border-color: var(--neon-glow);
    }

    .stat-value {
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 900;
      line-height: 1;
      margin-bottom: 6px;
      background: linear-gradient(180deg, #ffffff 30%, #e599ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stat-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #bfa6d9;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    @media (max-width: 700px) {
      .goal-badge { align-self: center; }
    }
  </style>
</head>
<body>

  <div class="hero-container">
    <div class="brand-title">COSMO</div>
    <h1 class="main-title">CHARITY RUN</h1>
    
    <div class="slogan-box">
      <div class="slogan-icon">
        <div class="battery-bar"></div>
        <div class="battery-bar"></div>
        <div class="battery-bar"></div>
        <div class="battery-bar"></div>
      </div>
      <div class="slogan-text">
        Перетворюємо кілометри<br>на донати для війська
      </div>
    </div>
  </div>

  <div class="dashboard-card">
    
    <div class="battery-wrapper">
      <div class="battery-nub"></div>
      <div class="battery-body">
        
        <div class="battery-level" id="battery-level">
          <div class="energy-surge">
            <div class="lightning-streak" style="width: 1px; height: 100px; top: 10%; left: 25%; transform: rotate(15deg);"></div>
            <div class="lightning-streak" style="width: 0.8px; height: 120px; top: 25%; left: 65%; transform: rotate(-10deg); animation-delay: 0.2s;"></div>
            <div class="energy-spark" style="top: 15%; left: 30%;"></div>
            <div class="energy-spark" style="top: 35%; left: 70%; animation-delay: 0.5s;"></div>
            <div class="energy-spark" style="top: 55%; left: 50%; animation-delay: 1s;"></div>
            <div class="energy-spark" style="top: 75%; left: 80%; animation-delay: 1.5s;"></div>
          </div>
        </div>

        <div class="battery-overlay"></div>

        <div class="battery-percent" id="battery-percent">0%</div>
      </div>
    </div>

    <div class="stats-section">
      <div class="goal-badge">
        🎯 Ціль: <span id="target-usd">$10,000</span> (<span id="target-km">1,000</span> км)
      </div>

      <div class="stat-card">
        <div class="stat-value" id="val-usd">$0</div>
        <div class="stat-label">Зібрано донату (1 км = $10)</div>
      </div>

      <div class="stat-card">
        <div class="stat-value" id="val-km">0 км</div>
        <div class="stat-label">Загальний забіг команди</div>
      </div>
    </div>

  </div>

  <script>
    // ==========================================
    // НАЛАШТУВАННЯ
    // ==========================================
    const SHEET_ID = '1RTtwActEuEmLpCCfCKDGt98iFCzX0QPMSv1QVWNUpC0'; // ID вашої Google Таблиці
    const GOAL_KM = 1000;                   // Загальна ціль у км
    const KM_RATE = 10;                     // 1 км = $10

    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

    async function loadStats() {
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error('Помилка завантаження. Статус: ' + response.status);
        
        // Отримуємо текст з файлу
        const csvText = await response.text();
        
        // Розбиваємо текст на рядки і прибираємо порожні
        const rows = csvText.split('\n').filter(row => row.trim() !== '');
        
        // Беремо останній рядок (якщо їх більше одного - беремо другий, інакше перший)
        let targetRow = rows.length > 1 ? rows[rows.length - 1] : rows[0];
        
        // Розбиваємо рядок по комірках (якщо є інші стовпці) і беремо першу комірку
        let firstCell = targetRow.split(',')[0];
        
        // Очищаємо від лапок, пробілів і замінюємо кому на крапку (для десяткових дробів)
        let cleanString = firstCell.replace(/"/g, '').trim().replace(',', '.');
        
        // Перетворюємо в число
        let km = parseFloat(cleanString);

        // Перевіряємо, чи вийшло нормальне число
        if (isNaN(km)) {
          console.error("Не вдалося розпізнати число. Отримано текст:", cleanString);
          km = 0; // Якщо там текст замість числа, ставимо 0
        }

        renderData(km);

      } catch (err) {
        console.error("Сталася помилка при отриманні даних:", err);
        // Запасний варіант для тесту
        renderData(220); 
      }
    }

    function renderData(km) {
      const usd = km * KM_RATE;
      const targetUsd = GOAL_KM * KM_RATE;
      const percent = Math.min(Math.floor((km / GOAL_KM) * 100), 100);

      document.getElementById('target-km').innerText = GOAL_KM.toLocaleString('uk-UA');
      document.getElementById('target-usd').innerText = '$' + targetUsd.toLocaleString('en-US');

      document.getElementById('val-km').innerText = km.toLocaleString('uk-UA') + ' км';
      document.getElementById('val-usd').innerText = '$' + usd.toLocaleString('en-US');
      
      // Оновлюємо рівень заряду
      document.getElementById('battery-level').style.height = percent + '%';
      document.getElementById('battery-percent').innerText = percent + '%';
    }

    // Запускаємо ТІЛЬКИ ОДИН РАЗ при відкритті сторінки
    loadStats();
    
    // Рядок із setInterval видалено, автоматичного оновлення більше немає.
  </script>
</body>
</html>
